spin_manifest_version = 2

[application]
authors = ["Thorsten Hans <thans@akamai.com>"]
description = ""
name = "jev-model-router"
version = "0.1.0"

[variables]
decition_model_api_key = { required = true, secret = true }
decision_model_endpoint = { default = "https://openrouter.ai" }
decision_model_name = { default = "typesafe/jev-1.13"}
llm_names = { default = "gpt-4:latest,llama3.2:1b,qwen2.5-coder:7b,deepseek-v4-flash:cloud,deepseek-v3.2:cloud,qwen3.5:4b" }
llm_fallback_name = { default = "gpt-4:latest" }
llm_endpoint = { required = true }
llm_api_key = { required = true, secret = true }

[[trigger.http]]
route = "/..."
component = "jev-model-router-ts"

[component.jev-model-router-ts]
source = "dist/jev-model-router-ts.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = ["{{ decision_model_endpoint }}", "{{ llm_endpoint }}"]

[component.jev-model-router-ts.variables]
decition_model_api_key = "{{ decition_model_api_key }}"
decision_model_endpoint = "{{ decision_model_endpoint }}"
decision_model_name = "{{ decision_model_name }}"
llm_names = "{{ llm_names }}"
llm_fallback_name = "{{ llm_fallback_name }}"
llm_endpoint = "{{ llm_endpoint }}"
llm_api_key = "{{ llm_api_key }}"

[component.jev-model-router-ts.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.ts"]
